server:
  port: 9090
spring:
  application:
    name: hmdp
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${HMDP_DB_URL:jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${HMDP_DB_USERNAME:root}
    password: ${HMDP_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 让已有库（已经有表但还没用过 Flyway）能“接入”而不去执行 V1
    baseline-version: 1
  redis:
    host: ${HMDP_REDIS_HOST:127.0.0.1}
    port: ${HMDP_REDIS_PORT:6379}
    password: ${HMDP_REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略空字段
mybatis-plus: 
  type-aliases-package: com.hmdp.entity # 别名扫描包

# 认证方式模板开关（Session + JWT 可并存）
# - enabled: true 时会启用拦截器注册（AuthMvcConfig）
# - JWT 解析/验签、Session 写入逻辑需要你在模板类里补全
hmdp:
  auth:
    enabled: true
    # auth.method 支持：auto（默认：jwt -> redis-token -> session）或逗号分隔优先级列表（例如：jwt,redis-token）
    method: redis-token
    jwt:
      # 不提供开发默认密钥；为空时 JWT 解析器不生效。
      secret: ${HMDP_JWT_SECRET:}
  upload:
    root: ${HMDP_UPLOAD_ROOT:./data/uploads}
    public-prefix: /imgs/
    max-bytes: 5242880
    max-width: 10000
    max-height: 10000
    max-pixels: 40000000
    temp-retention-hours: 24
    cleanup-batch-size: 100
    cleanup-interval-ms: 3600000
    deleting-retry-delay-minutes: 5
  idempotency:
    cleanup-interval-ms: 86400000
logging:
  level:
    com.hmdp: debug
