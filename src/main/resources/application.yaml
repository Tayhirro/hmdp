server:
  port: 8081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 让已有库（已经有表但还没用过 Flyway）能“接入”而不去执行 V1
    baseline-version: 1
  redis:
    host: 127.0.0.1
    port: 6739
    password:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略空字段
mybatis-plus: 
  type-aliases-package: com.hmdp.entity # 别名扫描包

# 认证方式模板开关（Session + JWT 可并存）
# - enabled: true 时会启用拦截器注册（AuthMvcConfig）
# - JWT 解析/验签、Session 写入逻辑需要你在模板类里补全
hmdp:
  auth:
    enabled: true
    # auth.method 支持：auto（默认：jwt -> redis-token -> session）或逗号分隔优先级列表（例如：jwt,redis-token）
    method: redis-token
    jwt:
      # HS256 secret（示例：至少 32 位随机字符串），为空则 JWT 解析器不生效
      secret: "123456"
logging:
  level:
    com.hmdp: debug
